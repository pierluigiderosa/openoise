description:

  en:
    genericName: QGIS Plugin
    shortDescription: >-
      OpeNoise Map is a QGIS plugin to compute the noise level generated
      by point source or by road source at fixed receiver points and buildings
    longDescription: >
      The plugin allows to compute the noise level generated by point source or by road source at fixed receiver points and buildings. Assigns dwellings and people living in dwellings to receiver points, according to 2002/49/EC Annex II and evaluates the harmful effects of ambient noise according to Annex III.
      Please consider the following condition:
      - geometrical divergence
      - atmospheric absorption ISO 9613-1
      - pure diffraction without ground effects, for horizontal and vertical obstacles
      - modelization is 3D


    features:
      - Compute noise level
